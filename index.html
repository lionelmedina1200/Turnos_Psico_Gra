<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turnos · Consultorio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="page-landing">

  <div class="landing-wrap">
    <div class="landing-left">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">Consultorio</span>
      </div>
      <div class="landing-copy">
        <h1>Un espacio<br><em>para vos.</em></h1>
        <p>Reservá tu turno de forma simple y segura. Te acompañamos en cada paso.</p>
      </div>
      <div class="landing-deco"></div>
    </div>

    <div class="landing-right">
      <div class="auth-card" id="authCard">

        <!-- TABS -->
        <div class="auth-tabs">
          <button class="auth-tab active" id="tabLogin" onclick="showAuthTab('login')">Ingresar</button>
          <button class="auth-tab" id="tabRegister" onclick="showAuthTab('register')">Crear cuenta</button>
        </div>

        <!-- LOGIN -->
        <div id="formLogin">
          <div class="field-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="tu@email.com" autocomplete="email">
          </div>
          <div class="field-group">
            <label>Contraseña</label>
            <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
          </div>
          <div class="auth-error" id="loginError"></div>
          <button class="btn-main" onclick="doLogin()">Ingresar</button>
          <div class="divider"><span>o</span></div>
          <button class="btn-google" onclick="doGoogleLogin()">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
            Continuar con Google
          </button>
        </div>

        <!-- REGISTER -->
        <div id="formRegister" style="display:none">
          <div class="field-group">
            <label>Nombre completo</label>
            <input type="text" id="regNombre" placeholder="María González">
          </div>
          <div class="field-group">
            <label>Teléfono (WhatsApp)</label>
            <input type="tel" id="regTel" placeholder="1165432100">
          </div>
          <div class="field-group">
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="tu@email.com">
          </div>
          <div class="field-group">
            <label>Contraseña</label>
            <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres">
          </div>
          <div class="auth-error" id="regError"></div>
          <button class="btn-main" onclick="doRegister()">Crear cuenta</button>
          <div class="divider"><span>o</span></div>
          <button class="btn-google" onclick="doGoogleLogin()">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
            Registrarse con Google
          </button>
        </div>

        <p class="auth-footer">¿Sos la psicóloga? <a href="admin.html">Ingresá acá →</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
