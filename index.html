<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turnos · Consultorio Graciela</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'DM Sans', sans-serif; color: #2c2c2c;
      -webkit-font-smoothing: antialiased;
      visibility: hidden; /* oculto hasta saber si hay sesión */
    }
    body.ready { visibility: visible; animation: fadeIn .2s ease; }
    @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }

    :root {
      --g1: #4d7a68; --g2: #3a6050; --g3: #2d4f42;
      --sage: #7a9e8e; --sage-l: #eaf2ee; --sage-m: #c2d9cf;
      --warm: #f0ede6;
      --rose: #c47b7b; --rose-l: #f7eded;
      --surf: #fff; --bord: rgba(0,0,0,0.09); --bord2: rgba(0,0,0,0.15);
      --t1: #2c2c2c; --t2: #6b6b6b; --t3: #aaa;
      --rs: 10px;
    }

    /* ── DESKTOP LAYOUT ── */
    .wrap { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }

    .hero {
      background: linear-gradient(155deg, var(--g1) 0%, var(--g2) 50%, var(--g3) 100%);
      padding: 3rem; display: flex; flex-direction: column; justify-content: space-between;
      position: relative; overflow: hidden;
    }
    .hero::after {
      content: ''; position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(194,217,207,.22) 0%, transparent 65%);
      bottom: -150px; right: -100px; pointer-events: none;
    }
    .h-brand { display: flex; align-items: center; gap: 8px; z-index: 1; }
    .h-dot { width: 8px; height: 8px; background: rgba(255,255,255,.6); border-radius: 50%; }
    .h-name { color: rgba(255,255,255,.75); font-size: .875rem; font-weight: 500; }
    .h-copy { z-index: 1; }
    .h-copy h1 {
      font-family: 'DM Serif Display', serif; font-size: 3rem; font-weight: 400;
      color: #fff; line-height: 1.12; margin-bottom: 1.25rem;
    }
    .h-copy h1 em { font-style: italic; color: var(--sage-m); }
    .h-copy p { color: rgba(255,255,255,.6); line-height: 1.7; max-width: 290px; font-size: .95rem; }
    .h-tags { display: flex; gap: 10px; align-self: flex-end; z-index: 1; }
    .h-tag {
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      border-radius: 20px; padding: 7px 14px; font-size: .78rem; color: rgba(255,255,255,.7);
    }

    .auth-side {
      background: var(--warm);
      display: flex; align-items: center; justify-content: center; padding: 2rem;
    }
    .card {
      background: var(--surf); border-radius: 20px; padding: 2.25rem;
      width: 100%; max-width: 400px;
      box-shadow: 0 4px 28px rgba(0,0,0,.08); border: 1px solid var(--bord);
    }

    /* ── FORM ELEMENTS ── */
    .tabs { display: flex; background: var(--warm); border-radius: var(--rs); padding: 4px; gap: 4px; margin-bottom: 1.5rem; }
    .tab { flex: 1; padding: 8px; border: none; background: none; border-radius: 7px; font-size: .875rem; font-family: 'DM Sans', sans-serif; cursor: pointer; color: var(--t2); transition: all .15s; }
    .tab.on { background: var(--surf); color: var(--t1); font-weight: 500; box-shadow: 0 1px 5px rgba(0,0,0,.09); }

    .fg { margin-bottom: 1rem; }
    .fg label { display: block; font-size: .7rem; color: var(--t2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
    .fg input {
      width: 100%; padding: 12px 14px; border: 1px solid var(--bord2);
      border-radius: var(--rs); font-family: 'DM Sans', sans-serif; font-size: 1rem;
      color: var(--t1); background: var(--surf); outline: none;
      transition: border-color .15s, box-shadow .15s;
      -webkit-appearance: none;
    }
    .fg input:focus { border-color: var(--g1); box-shadow: 0 0 0 3px rgba(77,122,104,.1); }

    .btn-p {
      width: 100%; padding: 13px; background: var(--g1); color: #fff;
      border: none; border-radius: var(--rs); font-family: 'DM Sans', sans-serif;
      font-size: 1rem; font-weight: 500; cursor: pointer; transition: background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-p:hover { background: var(--g2); }
    .btn-p:disabled { opacity: .55; cursor: default; }

    .btn-g {
      width: 100%; padding: 12px; background: var(--surf); color: var(--t1);
      border: 1px solid var(--bord2); border-radius: var(--rs);
      font-family: 'DM Sans', sans-serif; font-size: .9rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: background .12s; -webkit-tap-highlight-color: transparent;
    }
    .btn-g:hover { background: var(--warm); }

    .sep { text-align: center; margin: 1rem 0; position: relative; }
    .sep::before { content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: var(--bord); }
    .sep span { background: var(--surf); padding: 0 12px; position: relative; font-size: .78rem; color: var(--t3); }

    .err  { font-size: .82rem; color: var(--rose); background: var(--rose-l); padding: 9px 12px; border-radius: var(--rs); margin-bottom: 10px; display: none; }
    .succ { font-size: .82rem; color: var(--g1); background: var(--sage-l); padding: 9px 12px; border-radius: var(--rs); margin-bottom: 10px; display: none; }

    .foot { text-align: center; font-size: .8rem; color: var(--t3); margin-top: 1.25rem; }
    .foot a { color: var(--g1); text-decoration: none; font-weight: 500; }

    /* ── MOBILE ── */
    @media (max-width: 700px) {
      .wrap { grid-template-columns: 1fr; }
      .hero { display: none; }

      .auth-side {
        min-height: 100vh; padding: 0;
        align-items: flex-start; justify-content: flex-start;
        background: var(--surf);
      }
      .card {
        border-radius: 0; box-shadow: none; border: none;
        padding: 0; max-width: 100%; width: 100%;
        min-height: 100vh; display: flex; flex-direction: column;
      }

      /* Cabecera verde curva */
      .mob-top {
        background: linear-gradient(155deg, var(--g1) 0%, var(--g2) 100%);
        padding: 2.5rem 1.5rem 4rem;
        position: relative; overflow: hidden; flex-shrink: 0;
      }
      .mob-top::before {
        content: ''; position: absolute;
        width: 300px; height: 300px;
        background: radial-gradient(circle, rgba(194,217,207,.2) 0%, transparent 65%);
        top: -80px; right: -60px; pointer-events: none;
      }
      .mob-top::after {
        content: ''; position: absolute;
        bottom: -2px; left: -5%; right: -5%; height: 50px;
        background: var(--surf);
        border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      }
      .mob-brand { display: flex; align-items: center; gap: 7px; margin-bottom: 1.25rem; z-index: 1; position: relative; }
      .mob-brand .d { width: 7px; height: 7px; background: rgba(255,255,255,.6); border-radius: 50%; }
      .mob-brand span { color: rgba(255,255,255,.75); font-size: .825rem; font-weight: 500; }
      .mob-title { font-family: 'DM Serif Display', serif; font-size: 1.9rem; font-weight: 400; color: #fff; line-height: 1.15; position: relative; z-index: 1; }
      .mob-title em { font-style: italic; color: var(--sage-m); }
      .mob-sub { color: rgba(255,255,255,.6); font-size: .83rem; margin-top: .5rem; position: relative; z-index: 1; }

      .mob-form { padding: 1.75rem 1.5rem 2rem; flex: 1; }
      .tabs { background: #f0ede6; }
      .sep span { background: var(--surf); }
      .fg input { padding: 13px 14px; font-size: 1rem; }
      .btn-p { padding: 14px; }
      .btn-g { padding: 13px; }
    }

    @media (min-width: 701px) {
      .mob-top { display: none; }
      .mob-form { padding: 0; }
    }
  </style>
</head>
<body>

<div class="wrap">
  <!-- HERO desktop -->
  <div class="hero">
    <div class="h-brand"><span class="h-dot"></span><span class="h-name">Consultorio</span></div>
    <div class="h-copy">
      <h1>Un espacio<br><em>para vos.</em></h1>
      <p>Reservá tu turno de forma simple y segura. Te acompañamos en cada paso del proceso.</p>
    </div>
    <div class="h-tags">
      <span class="h-tag">🌿 Psicología</span>
      <span class="h-tag">📅 Turnos online</span>
    </div>
  </div>

  <!-- AUTH -->
  <div class="auth-side">
    <div class="card">

      <!-- Cabecera mobile -->
      <div class="mob-top">
        <div class="mob-brand"><span class="d"></span><span>Consultorio</span></div>
        <div class="mob-title">Un espacio<br><em>para vos.</em></div>
        <div class="mob-sub">Reservá tu turno de forma simple y segura.</div>
      </div>

      <div class="mob-form">
        <div class="tabs">
          <button class="tab on" id="tL" onclick="sw('login')">Ingresar</button>
          <button class="tab"    id="tR" onclick="sw('reg')">Crear cuenta</button>
        </div>

        <!-- LOGIN -->
        <div id="fL">
          <div class="err" id="eL"></div>
          <div class="fg"><label>Email</label><input type="email" id="lEmail" placeholder="tu@email.com" autocomplete="email" inputmode="email"></div>
          <div class="fg"><label>Contraseña</label><input type="password" id="lPass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
          <button class="btn-p" id="btnL" onclick="doLogin()">Ingresar</button>
          <div class="sep"><span>o</span></div>
          <button class="btn-g" onclick="doGoogle()">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
            Continuar con Google
          </button>
        </div>

        <!-- REGISTER -->
        <div id="fR" style="display:none">
          <div class="err" id="eR"></div>
          <div class="succ" id="okR"></div>
          <div class="fg"><label>Nombre completo</label><input type="text" id="rNom" placeholder="María González" autocomplete="name"></div>
          <div class="fg"><label>WhatsApp</label><input type="tel" id="rTel" placeholder="1165432100" inputmode="tel" autocomplete="tel"></div>
          <div class="fg"><label>Email</label><input type="email" id="rEmail" placeholder="tu@email.com" autocomplete="email" inputmode="email"></div>
          <div class="fg"><label>Contraseña</label><input type="password" id="rPass" placeholder="Mínimo 6 caracteres" autocomplete="new-password"></div>
          <button class="btn-p" id="btnR" onclick="doReg()">Crear cuenta</button>
          <div class="sep"><span>o</span></div>
          <button class="btn-g" onclick="doGoogle()">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
            Registrarse con Google
          </button>
        </div>

        <p class="foot">¿Sos la psicóloga? <a href="admin.html">Ingresá acá →</a></p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SURL  = 'https://dzvfjedtjhlvwipnxzmi.supabase.co';
const SKEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6dmZqZWR0amhsdndpcG54em1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NDc2NTMsImV4cCI6MjA5NDUyMzY1M30.5JcK7Ll67WIFoTY6Z00qiOEEbzh8nC3y1lmiBkuo8zU';
const ADMIN = 'gracielacolli@hotmail.com';
const sb = supabase.createClient(SURL, SKEY);
const $  = id => document.getElementById(id);

function go(u) { window.location.replace(u.email === ADMIN ? 'admin.html' : 'paciente.html'); }
function showE(id,m) { const e=$(id); e.textContent=m; e.style.display='block'; }
function showOk(id,m) { const e=$(id); e.textContent=m; e.style.display='block'; }

// Verificar sesión ANTES de mostrar cualquier cosa
sb.auth.getSession().then(({ data }) => {
  if (data.session) { go(data.session.user); }
  else { document.body.classList.add('ready'); }
}).catch(() => document.body.classList.add('ready'));

function sw(t) {
  $('fL').style.display = t==='login' ? 'block' : 'none';
  $('fR').style.display = t==='reg'   ? 'block' : 'none';
  $('tL').classList.toggle('on', t==='login');
  $('tR').classList.toggle('on', t==='reg');
  ['eL','eR','okR'].forEach(id => $( id).style.display='none');
}

async function doLogin() {
  const email=$('lEmail').value.trim(), pass=$('lPass').value;
  $('eL').style.display='none';
  if (!email||!pass) { showE('eL','Completá email y contraseña.'); return; }
  const b=$('btnL'); b.disabled=true; b.textContent='Ingresando...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password:pass });
  if (error) { b.disabled=false; b.textContent='Ingresar'; showE('eL','Email o contraseña incorrectos.'); return; }
  go(data.user);
}

async function doReg() {
  const nom=$('rNom').value.trim(), tel=$('rTel').value.trim(),
        email=$('rEmail').value.trim(), pass=$('rPass').value;
  ['eR','okR'].forEach(id=>$( id).style.display='none');
  if (!nom||!email||!pass) { showE('eR','Completá nombre, email y contraseña.'); return; }
  if (pass.length<6) { showE('eR','La contraseña necesita al menos 6 caracteres.'); return; }
  const b=$('btnR'); b.disabled=true; b.textContent='Creando cuenta...';
  const { data, error } = await sb.auth.signUp({ email, password:pass, options:{data:{nombre:nom,tel}} });
  if (error) { b.disabled=false; b.textContent='Crear cuenta'; showE('eR',error.message); return; }
  if (data.user) await sb.from('pacientes').upsert({user_id:data.user.id,nombre:nom,tel,email});
  b.disabled=false; b.textContent='Crear cuenta';
  if (data.session) { go(data.user); return; }
  showOk('okR','✓ Cuenta creada. Revisá tu email para confirmarla y luego ingresá.');
}

async function doGoogle() {
  await sb.auth.signInWithOAuth({
    provider:'google',
    options:{ redirectTo: window.location.origin+'/paciente.html' }
  });
}
</script>
</body>
</html>
