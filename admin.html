<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel · Psicóloga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #f7f5f0; min-height: 100vh; color: #2c2c2c; -webkit-font-smoothing: antialiased; font-size: 14px; }
    :root {
      --sage: #7a9e8e; --sage-deep: #4d7a68; --sage-light: #eaf2ee; --sage-mid: #c2d9cf;
      --warm: #f7f5f0; --warm2: #ede9e1; --rose: #c47b7b; --rose-light: #f7eded;
      --amber: #c49b5a; --amber-light: #fdf4e7; --blue-light: #eaf0fb; --blue-text: #2a4a8a;
      --surface: #fff; --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.13);
      --text: #2c2c2c; --text2: #6b6b6b; --text3: #a0a0a0;
      --r: 12px; --rs: 8px;
    }
    /* NAV */
    .topnav { height: 54px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; position: sticky; top: 0; z-index: 50; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-dot { width: 9px; height: 9px; background: var(--sage); border-radius: 50%; }
    .brand-name { font-weight: 500; font-size: 0.9rem; }
    .nav-btn { padding: 6px 14px; border: 1px solid var(--border2); border-radius: 20px; background: none; font-size: 0.8rem; cursor: pointer; color: var(--text2); }
    .nav-btn:hover { background: var(--warm); }
    /* LAYOUT */
    .app-layout { display: flex; min-height: calc(100vh - 54px); }
    .sidebar { width: 196px; background: var(--surface); border-right: 1px solid var(--border); padding: 1.25rem 0.75rem; display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
    .sb-btn { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: none; background: none; border-radius: var(--rs); font-family: 'DM Sans', sans-serif; font-size: 0.85rem; color: var(--text2); cursor: pointer; text-align: left; width: 100%; position: relative; transition: all 0.12s; }
    .sb-btn:hover { background: var(--warm); color: var(--text); }
    .sb-btn.active { background: var(--sage-light); color: var(--sage-deep); font-weight: 500; }
    .badge-dot { width: 7px; height: 7px; background: var(--rose); border-radius: 50%; margin-left: auto; }
    .main { flex: 1; padding: 1.75rem; overflow-y: auto; }
    /* SECTIONS */
    .section { display: none; }
    .section.active { display: block; }
    .sec-head { margin-bottom: 1.25rem; }
    .sec-head h2 { font-family: 'DM Serif Display', serif; font-size: 1.5rem; font-weight: 400; display: flex; align-items: center; justify-content: space-between; }
    .sec-sub { font-size: 0.8rem; color: var(--text2); margin-top: 4px; }
    /* CALENDAR */
    .cal-header { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; }
    .cal-header h3 { font-family: 'DM Serif Display', serif; font-size: 1.3rem; font-weight: 400; flex: 1; }
    .cal-nav { width: 30px; height: 30px; border: 1px solid var(--border2); border-radius: var(--rs); background: var(--surface); cursor: pointer; font-size: 1rem; }
    .cal-nav:hover { background: var(--warm); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-dow { text-align: center; font-size: 0.7rem; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 0; }
    .cal-day { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rs); padding: 6px; min-height: 64px; cursor: pointer; transition: all 0.12s; }
    .cal-day:hover { border-color: var(--sage-mid); background: var(--sage-light); }
    .cal-day.other-month { opacity: 0.3; cursor: default; pointer-events: none; }
    .cal-day.today { border-color: var(--sage); }
    .cal-day.has-events { background: var(--sage-light); }
    .cal-day.selected { border-color: var(--sage-deep); box-shadow: 0 0 0 2px rgba(77,122,104,0.15); }
    .cal-day-num { font-size: 0.8rem; font-weight: 500; margin-bottom: 3px; }
    .cal-day.today .cal-day-num { background: var(--sage-deep); color: #fff; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; }
    .cal-dots { display: flex; gap: 3px; flex-wrap: wrap; }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; }
    .dot-pend { background: var(--amber); }
    .dot-conf { background: var(--sage); }
    .cal-detail { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.125rem; margin-top: 0.875rem; }
    .cal-detail h4 { font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 1rem; margin-bottom: 0.875rem; }
    .cal-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.825rem; }
    .cal-row:last-child { border-bottom: none; }
    /* TURNOS */
    .turnos-list { display: flex; flex-direction: column; gap: 10px; }
    .t-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1rem 1.125rem; display: flex; align-items: flex-start; gap: 12px; }
    .t-card:hover { box-shadow: 0 2px 14px rgba(0,0,0,0.06); }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--sage-light); color: var(--sage-deep); font-weight: 500; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .t-body { flex: 1; min-width: 0; }
    .t-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 3px; flex-wrap: wrap; }
    .t-nombre { font-weight: 500; font-size: 0.9rem; }
    .t-meta { font-size: 0.775rem; color: var(--text2); display: flex; gap: 12px; flex-wrap: wrap; }
    .t-nota { font-size: 0.775rem; color: var(--text3); font-style: italic; margin-top: 3px; }
    .t-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    /* BADGES */
    .badge { font-size: 0.7rem; padding: 3px 9px; border-radius: 20px; font-weight: 500; }
    .b-pend { background: var(--amber-light); color: #7a5e1a; }
    .b-pago { background: var(--blue-light); color: var(--blue-text); }
    .b-conf { background: var(--sage-light); color: var(--sage-deep); }
    .b-canc { background: var(--rose-light); color: var(--rose); }
    /* BUTTONS */
    .btn-main { padding: 10px 16px; background: var(--sage-deep); color: white; border: none; border-radius: var(--rs); font-family: 'DM Sans', sans-serif; font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: background 0.15s; }
    .btn-main:hover { background: #3d6655; }
    .btn-sm { padding: 4px 11px; border: 1px solid var(--border2); border-radius: 20px; font-size: 0.75rem; font-family: 'DM Sans', sans-serif; cursor: pointer; background: var(--surface); color: var(--text); display: flex; align-items: center; gap: 3px; transition: all 0.12s; }
    .btn-confirm { border-color: var(--sage); color: var(--sage-deep); }
    .btn-confirm:hover { background: var(--sage-light); }
    .btn-reject { border-color: var(--rose); color: var(--rose); }
    .btn-reject:hover { background: var(--rose-light); }
    .btn-wsp { border-color: #25d366; color: #128c3e; }
    .btn-wsp:hover { background: #e9faf0; }
    .btn-ver { border-color: rgba(0,0,0,0.2); color: var(--text2); }
    .btn-ver:hover { background: var(--warm); }
    /* PILLS FILTER */
    .pills { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 0.875rem; }
    .pill { padding: 4px 12px; border: 1px solid var(--border2); border-radius: 20px; background: var(--surface); font-size: 0.75rem; font-family: 'DM Sans', sans-serif; cursor: pointer; color: var(--text2); transition: all 0.12s; }
    .pill.active { background: var(--sage-light); border-color: var(--sage); color: var(--sage-deep); font-weight: 500; }
    /* MSGS */
    .msgs-layout { display: grid; grid-template-columns: 220px 1fr; gap: 12px; height: calc(100vh - 210px); min-height: 380px; }
    .msgs-sb { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow-y: auto; }
    .msgs-chat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); display: flex; flex-direction: column; }
    .pat-item { padding: 11px 13px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.12s; display: flex; align-items: center; gap: 9px; }
    .pat-item:hover { background: var(--warm); }
    .pat-item.active { background: var(--sage-light); }
    .pat-name { font-size: 0.825rem; font-weight: 500; }
    .pat-prev { font-size: 0.75rem; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
    .unread-b { background: var(--rose); color: #fff; font-size: 0.65rem; padding: 2px 6px; border-radius: 10px; margin-left: auto; flex-shrink: 0; }
    .chat-header { padding: 11px 14px; border-bottom: 1px solid var(--border); font-weight: 500; font-size: 0.875rem; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 74%; padding: 8px 13px; border-radius: 14px; font-size: 0.825rem; line-height: 1.5; }
    .msg-me { background: var(--sage-light); align-self: flex-end; border-bottom-right-radius: 3px; }
    .msg-other { background: var(--warm2); align-self: flex-start; border-bottom-left-radius: 3px; }
    .msg-time { font-size: 0.65rem; color: var(--text3); margin-top: 2px; }
    .chat-input-wrap { border-top: 1px solid var(--border); padding: 10px; display: flex; gap: 7px; align-items: flex-end; }
    .chat-input { flex: 1; border: 1px solid var(--border2); border-radius: 20px; padding: 8px 14px; font-size: 0.825rem; font-family: 'DM Sans', sans-serif; resize: none; outline: none; transition: border-color 0.15s; }
    .chat-input:focus { border-color: var(--sage); }
    .chat-send { width: 34px; height: 34px; border-radius: 50%; background: var(--sage-deep); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.875rem; }
    .msgs-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text3); font-size: 0.85rem; }
    /* CONFIG */
    .cfg-grid { display: flex; flex-direction: column; gap: 12px; max-width: 600px; }
    .cfg-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.25rem; }
    .cfg-card h3 { font-size: 0.9rem; font-weight: 500; margin-bottom: 0.875rem; }
    .field-group { margin-bottom: 0.875rem; }
    .field-group label { display: block; font-size: 0.72rem; color: var(--text2); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
    .field-group input { width: 100%; padding: 9px 12px; border: 1px solid var(--border2); border-radius: var(--rs); font-family: 'DM Sans', sans-serif; font-size: 0.875rem; outline: none; transition: border-color 0.15s; }
    .field-group input:focus { border-color: var(--sage); }
    .horarios-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .hora-check { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; cursor: pointer; }
    .hora-check input { accent-color: var(--sage-deep); }
    .cfg-ok { color: var(--sage-deep); font-size: 0.85rem; font-weight: 500; margin-top: 8px; display: none; }
    /* MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); align-items: center; justify-content: center; z-index: 100; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: var(--surface); border-radius: 16px; padding: 1.75rem; max-width: 460px; width: 92%; max-height: 90vh; overflow-y: auto; position: relative; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
    .modal-close { position: absolute; top: 14px; right: 16px; border: none; background: none; cursor: pointer; font-size: 1rem; color: var(--text3); }
    .modal-close:hover { color: var(--text); }
    .modal-img { width: 100%; max-height: 280px; object-fit: contain; border-radius: var(--rs); margin-top: 10px; border: 1px solid var(--border); }
    .modal-actions { display: flex; gap: 8px; margin-top: 1rem; flex-wrap: wrap; }
    .wsp-preview { background: #e9faf0; border: 1px solid #b2e4c6; border-radius: var(--rs); padding: 11px; font-size: 0.8rem; color: #1a5e3a; white-space: pre-line; line-height: 1.6; margin: 10px 0; }
    /* LOADING */
    .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(247,245,240,0.85); align-items: center; justify-content: center; z-index: 999; flex-direction: column; gap: 12px; font-size: 0.875rem; color: var(--text2); }
    .loading-overlay.show { display: flex; }
    .spinner { width: 26px; height: 26px; border: 2px solid var(--sage-mid); border-top-color: var(--sage-deep); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* LOGIN CENTRADO */
    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 54px); padding: 2rem; }
    .auth-card { background: var(--surface); border-radius: 18px; padding: 2rem; max-width: 360px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.09); border: 1px solid var(--border); }
    .auth-logo { text-align: center; margin-bottom: 1.5rem; }
    .logo-circle { width: 50px; height: 50px; border-radius: 50%; background: var(--sage-light); color: var(--sage-deep); font-family: 'DM Serif Display', serif; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
    .auth-logo h2 { font-size: 1.1rem; font-family: 'DM Serif Display', serif; font-weight: 400; }
    .auth-error { font-size: 0.8rem; color: var(--rose); background: var(--rose-light); padding: 9px 12px; border-radius: var(--rs); margin-bottom: 10px; display: none; }
    .empty-state { text-align: center; padding: 2.5rem; color: var(--text3); font-size: 0.875rem; }
    @media (max-width: 700px) {
      .app-layout { flex-direction: column; }
      .sidebar { width: 100%; flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); }
      .msgs-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <span id="loadingText">Verificando acceso...</span>
</div>

<div class="topnav">
  <div class="brand"><span class="brand-dot"></span><span class="brand-name">Panel psicóloga</span></div>
  <div id="navRight"></div>
</div>

<!-- LOGIN -->
<div id="loginSection" class="login-wrap" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-circle">G</div>
      <h2>Acceso psicóloga</h2>
    </div>
    <div class="auth-error" id="adminError"></div>
    <div class="field-group">
      <label>Email</label>
      <input type="email" id="adminEmail" placeholder="gracielacolli@gmail.com" autocomplete="email">
    </div>
    <div class="field-group">
      <label>Contraseña</label>
      <input type="password" id="adminPass" placeholder="••••••••" onkeydown="if(event.key==='Enter') doAdminLogin()">
    </div>
    <button class="btn-main" style="width:100%" onclick="doAdminLogin()">Ingresar</button>
    <p style="text-align:center;font-size:0.775rem;color:var(--text3);margin-top:1rem">
      <a href="index.html" style="color:var(--sage-deep);text-decoration:none">← Volver al inicio</a>
    </p>
  </div>
</div>

<!-- PANEL PRINCIPAL -->
<div id="panelSection" style="display:none">
  <div class="app-layout">
    <aside class="sidebar">
      <button class="sb-btn active" id="sb-calendario" onclick="showSection('calendario')">📅 Calendario</button>
      <button class="sb-btn" id="sb-solicitudes" onclick="showSection('solicitudes')">✅ Solicitudes <span class="badge-dot" id="dotSol" style="display:none"></span></button>
      <button class="sb-btn" id="sb-mensajes" onclick="showSection('mensajes')">💬 Mensajes <span class="badge-dot" id="dotMsg" style="display:none"></span></button>
      <button class="sb-btn" id="sb-config" onclick="showSection('config')">⚙️ Config</button>
    </aside>
    <div class="main">

      <!-- CALENDARIO -->
      <div class="section active" id="sec-calendario">
        <div class="sec-head">
          <h2>
            <span id="calTitle">Cargando...</span>
            <div style="display:flex;gap:6px">
              <button class="cal-nav" onclick="cambiarMes(-1)">←</button>
              <button class="cal-nav" onclick="cambiarMes(1)">→</button>
            </div>
          </h2>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-detail" id="calDetail" style="display:none">
          <h4 id="calDetailTitle"></h4>
          <div id="calDetailBody"></div>
        </div>
      </div>

      <!-- SOLICITUDES -->
      <div class="section" id="sec-solicitudes">
        <div class="sec-head"><h2>Solicitudes de turno</h2></div>
        <div class="pills">
          <button class="pill active" onclick="setFiltro('pago_enviado',this)">Comprobante enviado</button>
          <button class="pill" onclick="setFiltro('pendiente_pago',this)">Sin pago</button>
          <button class="pill" onclick="setFiltro('confirmado',this)">Confirmados</button>
          <button class="pill" onclick="setFiltro('cancelado',this)">Cancelados</button>
          <button class="pill" onclick="setFiltro('todos',this)">Todos</button>
        </div>
        <div class="turnos-list" id="solicitudesList"></div>
      </div>

      <!-- MENSAJES -->
      <div class="section" id="sec-mensajes">
        <div class="sec-head"><h2>Mensajes</h2></div>
        <div class="msgs-layout">
          <div class="msgs-sb" id="msgsSidebar"><div class="msgs-empty">Sin conversaciones</div></div>
          <div class="msgs-chat" id="msgsChat"><div class="msgs-empty">Seleccioná un paciente</div></div>
        </div>
      </div>

      <!-- CONFIG -->
      <div class="section" id="sec-config">
        <div class="sec-head"><h2>Configuración</h2></div>
        <div class="cfg-grid">
          <div class="cfg-card">
            <h3>Datos de pago</h3>
            <div class="field-group"><label>CBU</label><input id="cfgCBU" placeholder="Número de CBU"></div>
            <div class="field-group"><label>Alias</label><input id="cfgAlias" placeholder="alias.mp"></div>
            <div class="field-group"><label>Titular</label><input id="cfgTitular" placeholder="Nombre Apellido"></div>
          </div>
          <div class="cfg-card">
            <h3>WhatsApp (para avisos)</h3>
            <div class="field-group"><label>Tu número con código de país, sin +</label><input id="cfgWsp" placeholder="5491165432100"></div>
          </div>
          <div class="cfg-card">
            <h3>Horarios disponibles</h3>
            <p style="font-size:0.8rem;color:var(--text2);margin-bottom:10px">Marcá los que ofrecés</p>
            <div class="horarios-grid" id="horariosGrid"></div>
          </div>
        </div>
        <button class="btn-main" style="margin-top:1rem" onclick="saveConfig()">Guardar cambios</button>
        <div class="cfg-ok" id="cfgOk">✓ Guardado correctamente</div>
      </div>

    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ── CONFIG ──────────────────────────────────────────────────
const SUPABASE_URL      = 'https://dzvfjedtjhlvwipnxzmi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6dmZqZWR0amhsdndpcG54em1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NDc2NTMsImV4cCI6MjA5NDUyMzY1M30.5JcK7Ll67WIFoTY6Z00qiOEEbzh8nC3y1lmiBkuo8zU';
const ADMIN_EMAIL       = 'gracielacolli@gmail.com';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const HORAS_TODAS = ['08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30','12:00','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00'];
let allTurnos = [], filtro = 'pago_enviado', calYear, calMonth, selectedPatient = null;

// ── HELPERS ─────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function showLoading(t) { $('loadingText').textContent = t||'Cargando...'; $('loadingOverlay').classList.add('show'); }
function hideLoading() { $('loadingOverlay').classList.remove('show'); }
function closeModal() { $('modalOverlay').classList.remove('open'); }
function openModal(html) { $('modalContent').innerHTML = html; $('modalOverlay').classList.add('open'); }
function fmtFecha(f) {
  if (!f) return '';
  const [y,m,d] = f.split('-');
  const meses = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${parseInt(d)} ${meses[parseInt(m)]} ${y}`;
}
function fmtTime(ts) { return ts ? new Date(ts).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}) : ''; }
function initials(n) { return (n||'?').split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase(); }
function esc(t) { return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── INIT ─────────────────────────────────────────────────────
showLoading('Verificando acceso...');
sb.auth.getSession().then(({ data }) => {
  if (data.session && data.session.user.email === ADMIN_EMAIL) {
    showPanel(data.session.user);
  } else if (data.session) {
    hideLoading();
    window.location.replace('index.html');
  } else {
    hideLoading();
    $('loginSection').style.display = 'flex';
  }
});

function showPanel(user) {
  $('loginSection').style.display = 'none';
  $('panelSection').style.display = 'block';
  $('navRight').innerHTML = `<button class="nav-btn" onclick="doLogout()">Salir</button>`;
  const now = new Date(); calYear = now.getFullYear(); calMonth = now.getMonth();
  hideLoading();
  loadAll();
  buildHorariosConfig();
  loadConfig();
  subscribeRealtime();
}

async function doAdminLogin() {
  const email = $('adminEmail').value.trim();
  const pass  = $('adminPass').value;
  $('adminError').style.display = 'none';
  if (!email || !pass) { showErr2('Completá email y contraseña.'); return; }
  if (email !== ADMIN_EMAIL) { showErr2('Este acceso es solo para la psicóloga.'); return; }
  showLoading('Ingresando...');
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { hideLoading(); showErr2('Contraseña incorrecta.'); return; }
  showPanel(data.user);
}
function showErr2(msg) { $('adminError').textContent = msg; $('adminError').style.display = 'block'; }

async function doLogout() { await sb.auth.signOut(); window.location.replace('index.html'); }

// ── SECCIONES ────────────────────────────────────────────────
function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.sb-btn').forEach(b => b.classList.remove('active'));
  $('sec-' + id).classList.add('active');
  $('sb-' + id).classList.add('active');
  if (id === 'calendario') renderCalendar();
  if (id === 'mensajes') loadMensajes();
}

// ── CARGAR DATOS ─────────────────────────────────────────────
async function loadAll() {
  const { data } = await sb.from('turnos').select('*').order('fecha').order('hora');
  allTurnos = data || [];
  renderSolicitudes();
  renderCalendar();
  updateBadges();
}

function updateBadges() {
  const pend = allTurnos.filter(t => t.estado === 'pago_enviado' || t.estado === 'pendiente_pago').length;
  $('dotSol').style.display = pend ? 'inline-block' : 'none';
}

// ── SOLICITUDES ──────────────────────────────────────────────
function setFiltro(f, btn) {
  filtro = f;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  renderSolicitudes();
}

const LABELS = { pendiente_pago:'Sin pago', pago_enviado:'Comprobante enviado', confirmado:'Confirmado', cancelado:'Cancelado' };

function renderSolicitudes() {
  const lista = filtro === 'todos' ? allTurnos : allTurnos.filter(t => t.estado === filtro);
  const el = $('solicitudesList');
  if (!lista.length) { el.innerHTML = '<div class="empty-state">No hay turnos en esta categoría.</div>'; return; }
  el.innerHTML = lista.map(t => {
    const cls = { pendiente_pago:'b-pend', pago_enviado:'b-pago', confirmado:'b-conf', cancelado:'b-canc' }[t.estado] || '';
    const av = initials(t.paciente_nombre);
    const acciones = `
      ${t.comprobante_url ? `<button class="btn-sm btn-ver" onclick="verComprobante('${t.id}')">Ver comprobante</button>` : ''}
      ${['pago_enviado','pendiente_pago'].includes(t.estado) ? `<button class="btn-sm btn-confirm" onclick="confirmarTurno('${t.id}')">✓ Confirmar</button>` : ''}
      ${t.estado !== 'cancelado' ? `<button class="btn-sm btn-reject" onclick="cancelarTurno('${t.id}')">✕ Cancelar</button>` : ''}
      ${t.estado === 'confirmado' ? `<button class="btn-sm btn-wsp" onclick="prepWsp('${t.id}')">📲 WhatsApp</button>` : ''}
    `;
    return `<div class="t-card">
      <div class="avatar">${av}</div>
      <div class="t-body">
        <div class="t-top"><div class="t-nombre">${esc(t.paciente_nombre||'—')}</div><span class="badge ${cls}">${LABELS[t.estado]||t.estado}</span></div>
        <div class="t-meta"><span>📅 ${fmtFecha(t.fecha)}</span><span>🕐 ${t.hora}</span>${t.paciente_tel?`<span>📱 ${t.paciente_tel}</span>`:''}</div>
        ${t.motivo?`<div class="t-nota">"${esc(t.motivo)}"</div>`:''}
        <div class="t-actions">${acciones}</div>
      </div>
    </div>`;
  }).join('');
}

async function confirmarTurno(id) {
  await sb.from('turnos').update({ estado: 'confirmado' }).eq('id', id);
  await loadAll();
  prepWsp(id);
}
async function cancelarTurno(id) {
  if (!confirm('¿Cancelar este turno?')) return;
  await sb.from('turnos').update({ estado: 'cancelado' }).eq('id', id);
  loadAll();
}

// ── COMPROBANTE ───────────────────────────────────────────────
function verComprobante(id) {
  const t = allTurnos.find(x => x.id === id);
  if (!t) return;
  openModal(`
    <h3 style="font-family:'DM Serif Display',serif;font-weight:400;margin-bottom:6px">Comprobante de pago</h3>
    <p style="font-size:.8rem;color:var(--text2)">${esc(t.paciente_nombre)} · ${fmtFecha(t.fecha)} ${t.hora}</p>
    ${t.comprobante_url ? `<img src="${t.comprobante_url}" class="modal-img" alt="Comprobante">` : '<p style="margin-top:12px;color:var(--text3);font-size:.85rem">Sin imagen adjunta.</p>'}
    <div class="modal-actions">
      ${['pago_enviado','pendiente_pago'].includes(t.estado) ? `<button class="btn-main" onclick="confirmarTurno('${t.id}');closeModal()">✓ Confirmar turno</button>` : ''}
      <button class="btn-sm btn-reject" onclick="cancelarTurno('${t.id}');closeModal()">✕ Cancelar</button>
    </div>
  `);
}

// ── WHATSAPP ──────────────────────────────────────────────────
async function prepWsp(id) {
  const t = allTurnos.find(x => x.id === id);
  if (!t) return;
  const { data: cfg } = await sb.from('config').select('wsp_psicologa').single();
  const telPsi = cfg?.wsp_psicologa || '';
  const msgPac = `Hola ${(t.paciente_nombre||'').split(' ')[0]} 👋\n\nTu turno de psicología está *confirmado* ✅\n📅 Fecha: ${fmtFecha(t.fecha)}\n🕐 Hora: ${t.hora}\n\nCualquier cambio avisame con anticipación. ¡Te espero! 😊`;
  const msgPsi = `📋 Turno confirmado\n👤 ${t.paciente_nombre}\n📅 ${fmtFecha(t.fecha)}\n🕐 ${t.hora}\n📱 ${t.paciente_tel||'—'}`;
  openModal(`
    <h3 style="font-family:'DM Serif Display',serif;font-weight:400;margin-bottom:6px">📲 Avisos por WhatsApp</h3>
    <p style="font-size:.8rem;color:var(--text2);margin-bottom:10px">Mensaje que se enviará al paciente:</p>
    <div class="wsp-preview">${esc(msgPac)}</div>
    <div class="modal-actions" style="flex-wrap:wrap">
      <button class="btn-sm btn-wsp" onclick="window.open('https://wa.me/${t.paciente_tel?.replace(/\\D/g,'')}?text=${encodeURIComponent(msgPac)}','_blank')">📲 Enviar al paciente</button>
      ${telPsi ? `<button class="btn-sm btn-wsp" onclick="window.open('https://wa.me/${telPsi.replace(/\\D/g,'')}?text=${encodeURIComponent(msgPsi)}','_blank')">📲 Avisarme a mí</button>` : ''}
      <button class="btn-sm" onclick="closeModal()">Cerrar</button>
    </div>
  `);
}

// ── CALENDARIO ────────────────────────────────────────────────
function cambiarMes(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  renderCalendar();
  $('calDetail').style.display = 'none';
}

function renderCalendar() {
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  $('calTitle').textContent = `${meses[calMonth]} ${calYear}`;
  const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const hoy = new Date();
  let html = dias.map(d => `<div class="cal-dow">${d}</div>`).join('');
  const primer = new Date(calYear, calMonth, 1);
  const ultimo = new Date(calYear, calMonth + 1, 0);
  for (let i = 0; i < primer.getDay(); i++) html += `<div class="cal-day other-month"></div>`;
  for (let d = 1; d <= ultimo.getDate(); d++) {
    const fStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const tdDay = allTurnos.filter(t => t.fecha === fStr && t.estado !== 'cancelado');
    const esToy = hoy.getFullYear()===calYear && hoy.getMonth()===calMonth && hoy.getDate()===d;
    const hasPend = tdDay.some(t => ['pendiente_pago','pago_enviado'].includes(t.estado));
    const hasConf = tdDay.some(t => t.estado === 'confirmado');
    const cls = ['cal-day', esToy?'today':'', tdDay.length?'has-events':''].filter(Boolean).join(' ');
    const dots = [hasPend?'<span class="cal-dot dot-pend"></span>':'', hasConf?'<span class="cal-dot dot-conf"></span>':''].join('');
    html += `<div class="${cls}" onclick="selectDay('${fStr}', this)">
      <div class="cal-day-num">${d}</div>
      ${dots?`<div class="cal-dots">${dots}</div>`:''}
    </div>`;
  }
  $('calGrid').innerHTML = html;
}

function selectDay(fecha, el) {
  document.querySelectorAll('.cal-day').forEach(d => d.classList.remove('selected'));
  el.classList.add('selected');
  const tdDay = allTurnos.filter(t => t.fecha === fecha && t.estado !== 'cancelado')
                          .sort((a,b)=>a.hora.localeCompare(b.hora));
  $('calDetailTitle').textContent = fmtFecha(fecha);
  if (!tdDay.length) {
    $('calDetailBody').innerHTML = '<p style="color:var(--text3);font-size:.85rem">Sin turnos este día.</p>';
  } else {
    $('calDetailBody').innerHTML = tdDay.map(t => {
      const cls = { pendiente_pago:'b-pend', pago_enviado:'b-pago', confirmado:'b-conf' }[t.estado] || '';
      return `<div class="cal-row">
        <span style="font-weight:500;min-width:44px">${t.hora}</span>
        <span style="flex:1">${esc(t.paciente_nombre||'—')}</span>
        <span class="badge ${cls}">${LABELS[t.estado]||t.estado}</span>
      </div>`;
    }).join('');
  }
  $('calDetail').style.display = 'block';
}

// ── MENSAJES ──────────────────────────────────────────────────
async function loadMensajes() {
  const { data: msgs } = await sb.from('mensajes').select('paciente_id, contenido, created_at, leido, remitente').order('created_at', {ascending:false});
  if (!msgs || !msgs.length) { $('msgsSidebar').innerHTML = '<div class="msgs-empty">Sin mensajes</div>'; return; }
  const byPac = {};
  msgs.forEach(m => { if (!byPac[m.paciente_id]) byPac[m.paciente_id] = {msgs:[], unread:0}; byPac[m.paciente_id].msgs.push(m); if (!m.leido && m.remitente==='paciente') byPac[m.paciente_id].unread++; });
  const ids = Object.keys(byPac);
  const { data: pacs } = await sb.from('pacientes').select('user_id,nombre').in('user_id', ids);
  const nomMap = {}; (pacs||[]).forEach(p => nomMap[p.user_id] = p.nombre);
  $('msgsSidebar').innerHTML = ids.map(pid => {
    const info = byPac[pid]; const nom = nomMap[pid] || 'Paciente';
    return `<div class="pat-item ${selectedPatient===pid?'active':''}" onclick="selectPatient('${pid}','${nom.replace(/'/g,"\\'")}')">
      <div class="avatar" style="width:30px;height:30px;font-size:.72rem;flex-shrink:0">${initials(nom)}</div>
      <div style="min-width:0;flex:1"><div class="pat-name">${esc(nom)}</div><div class="pat-prev">${esc(info.msgs[0]?.contenido||'')}</div></div>
      ${info.unread ? `<span class="unread-b">${info.unread}</span>` : ''}
    </div>`;
  }).join('');
  const totalU = Object.values(byPac).reduce((s,x)=>s+x.unread,0);
  $('dotMsg').style.display = totalU ? 'inline-block' : 'none';
}

async function selectPatient(pid, nombre) {
  selectedPatient = pid;
  await sb.from('mensajes').update({leido:true}).eq('paciente_id',pid).eq('remitente','paciente');
  const { data: msgs } = await sb.from('mensajes').select('*').eq('paciente_id',pid).order('created_at',{ascending:true});
  $('msgsChat').innerHTML = `
    <div class="chat-header">${esc(nombre)}</div>
    <div class="chat-messages" id="chatMsgsAdmin">${(msgs||[]).map(m=>{
      const isP = m.remitente==='psicologa';
      return `<div><div class="msg ${isP?'msg-me':'msg-other'}">${esc(m.contenido)}</div><div class="msg-time" style="text-align:${isP?'right':'left'}">${fmtTime(m.created_at)}</div></div>`;
    }).join('')||'<p style="text-align:center;color:var(--text3);font-size:.8rem;padding:1.5rem">Sin mensajes todavía.</p>'}</div>
    <div class="chat-input-wrap">
      <textarea class="chat-input" id="adminMsgIn" placeholder="Responder..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAdminMsg('${pid}','${nombre.replace(/'/g,"\\'")}')}"></textarea>
      <button class="chat-send" onclick="sendAdminMsg('${pid}','${nombre.replace(/'/g,"\\'")}')">➤</button>
    </div>
  `;
  const mc = $('chatMsgsAdmin'); if (mc) mc.scrollTop = mc.scrollHeight;
  loadMensajes();
}

async function sendAdminMsg(pid, nombre) {
  const inp = $('adminMsgIn'); if (!inp) return;
  const text = inp.value.trim(); if (!text) return;
  inp.value = '';
  await sb.from('mensajes').insert({ paciente_id:pid, remitente:'psicologa', contenido:text });
  selectPatient(pid, nombre);
}

// ── CONFIG ────────────────────────────────────────────────────
function buildHorariosConfig() {
  $('horariosGrid').innerHTML = HORAS_TODAS.map(h => `<label class="hora-check"><input type="checkbox" value="${h}" checked> ${h}</label>`).join('');
}

async function loadConfig() {
  const { data } = await sb.from('config').select('*').single();
  if (!data) return;
  if (data.cbu) $('cfgCBU').value = data.cbu;
  if (data.alias) $('cfgAlias').value = data.alias;
  if (data.titular) $('cfgTitular').value = data.titular;
  if (data.wsp_psicologa) $('cfgWsp').value = data.wsp_psicologa;
  if (data.horarios) {
    document.querySelectorAll('#horariosGrid input').forEach(cb => { cb.checked = data.horarios.includes(cb.value); });
  }
}

async function saveConfig() {
  const horarios = [...document.querySelectorAll('#horariosGrid input:checked')].map(c => c.value);
  const payload = { id:1, cbu:$('cfgCBU').value.trim(), alias:$('cfgAlias').value.trim(), titular:$('cfgTitular').value.trim(), wsp_psicologa:$('cfgWsp').value.trim(), horarios };
  const { error } = await sb.from('config').upsert(payload);
  const ok = $('cfgOk'); ok.style.display = error ? 'none' : 'block';
  if (!error) setTimeout(() => { ok.style.display = 'none'; }, 2500);
}

// ── REALTIME ──────────────────────────────────────────────────
function subscribeRealtime() {
  sb.channel('admin-rt')
    .on('postgres_changes', { event:'*', schema:'public', table:'turnos' }, loadAll)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'mensajes' }, () => { loadMensajes(); if (selectedPatient) selectPatient(selectedPatient,''); })
    .subscribe();
}
</script>
