<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de cuenta · Consultorio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #f7f5f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #2c2c2c;
      -webkit-font-smoothing: antialiased;
    }
    :root {
      --sage: #7a9e8e; --sage-deep: #4d7a68; --sage-light: #eaf2ee; --sage-mid: #c2d9cf;
      --rose: #c47b7b; --rose-light: #f7eded;
      --surface: #fff; --border: rgba(0,0,0,0.08);
      --text2: #6b6b6b; --text3: #a0a0a0;
    }

    .card {
      background: var(--surface);
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    /* Icono animado */
    .icon-wrap {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--sage-light);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .icon-wrap svg { animation: drawCheck 0.4s ease 0.2s both; }
    @keyframes drawCheck {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }

    .brand {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-bottom: 2rem;
    }
    .brand-dot { width: 9px; height: 9px; background: var(--sage); border-radius: 50%; }
    .brand-name { font-weight: 500; font-size: 0.9rem; }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem; font-weight: 400;
      margin-bottom: 0.75rem;
      color: var(--sage-deep);
    }
    p {
      font-size: 0.9rem; color: var(--text2);
      line-height: 1.65; margin-bottom: 1.75rem;
    }
    p strong { color: #2c2c2c; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 28px;
      background: var(--sage-deep); color: white;
      border: none; border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; font-weight: 500;
      cursor: pointer; text-decoration: none;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { background: #3d6655; }

    /* Estado error */
    .card.error .icon-wrap { background: var(--rose-light); }
    .card.error h1 { color: var(--rose); }

    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.78rem; color: var(--text3);
      line-height: 1.6;
    }

    /* Loading */
    .loading-state { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .spin { width: 32px; height: 32px; border: 2px solid var(--sage-mid); border-top-color: var(--sage-deep); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state p { font-size: 0.875rem; color: var(--text2); margin: 0; }
  </style>
</head>
<body>

<div class="brand"><span class="brand-dot"></span><span class="brand-name">Consultorio</span></div>

<div class="card" id="card">
  <!-- Se reemplaza con JS -->
  <div class="loading-state">
    <div class="spin"></div>
    <p>Confirmando tu cuenta...</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SURL = 'https://dzvfjedtjhlvwipnxzmi.supabase.co';
const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6dmZqZWR0amhsdndpcG54em1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NDc2NTMsImV4cCI6MjA5NDUyMzY1M30.5JcK7Ll67WIFoTY6Z00qiOEEbzh8nC3y1lmiBkuo8zU';
const sb = supabase.createClient(SURL, SKEY);

function showSuccess(email) {
  document.getElementById('card').innerHTML = `
    <div class="icon-wrap">
      <svg width="34" height="34" fill="none" stroke="#4d7a68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1>¡Cuenta confirmada!</h1>
    <p>Tu cuenta ${email ? `(<strong>${email}</strong>)` : ''} fue activada correctamente.<br>Ya podés iniciar sesión y reservar tu turno.</p>
    <a class="btn" href="index.html">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Ir a iniciar sesión
    </a>
    <p class="footer-note">Si tuvieras algún problema para ingresar,<br>contactá a tu psicóloga.</p>
  `;
}

function showError(msg) {
  document.getElementById('card').classList.add('error');
  document.getElementById('card').innerHTML = `
    <div class="icon-wrap">
      <svg width="34" height="34" fill="none" stroke="#c47b7b" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </div>
    <h1>Algo salió mal</h1>
    <p>${msg || 'El link de confirmación expiró o ya fue usado. Intentá registrarte de nuevo.'}</p>
    <a class="btn" href="index.html" style="background:#c47b7b">
      Volver al inicio
    </a>
    <p class="footer-note">Si el problema continúa, contactá a tu psicóloga.</p>
  `;
}

async function confirmar() {
  try {
    // 1. Intentar con token_hash en la URL (?token_hash=...&type=email)
    const qp = new URLSearchParams(window.location.search);
    const tokenHash = qp.get('token_hash');
    const type      = qp.get('type');

    if (tokenHash) {
      const { data, error } = await sb.auth.verifyOtp({
        token_hash: tokenHash,
        type: type || 'email'
      });
      if (error) {
        showError('El link de confirmación expiró o ya fue usado. Intentá registrarte de nuevo.');
      } else {
        showSuccess(data.user?.email);
      }
      return;
    }

    // 2. Intentar con access_token en el hash (#access_token=...&type=signup)
    const hash = window.location.hash.substring(1);
    if (hash) {
      const hp = new URLSearchParams(hash);
      const accessToken  = hp.get('access_token');
      const refreshToken = hp.get('refresh_token');
      if (accessToken) {
        const { data, error } = await sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken || '' });
        if (error) { showError(); return; }
        showSuccess(data.user?.email);
        return;
      }
    }

    // 3. Sin params: escuchar onAuthStateChange con timeout
    const timeout = setTimeout(() => {
      showError('El link de confirmación expiró o ya fue usado. Intentá registrarte de nuevo.');
    }, 5000);

    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' || event === 'USER_UPDATED') {
        clearTimeout(timeout);
        showSuccess(session?.user?.email);
      }
    });

  } catch(e) {
    showError();
  }
}

confirmar();
</script>
</body>
</html>
